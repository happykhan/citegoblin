[project]
site_name = "CiteGoblin"
site_description = "Manage Google Docs citations from comments, with DOI and PMID lookup, CSL styles and bibliography exports."
site_url = "https://happykhan.github.io/citegoblin/"
repo_url = "https://github.com/happykhan/citegoblin"
repo_name = "happykhan/citegoblin"
edit_uri = "edit/main/docs/"
nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Install" = "getting-started/install.md" },
    { "Google sign-in" = "getting-started/google-login.md" },
    { "Beta testing" = "getting-started/beta-testing.md" },
    { "First document" = "getting-started/first-document.md" },
    { "Google Docs walkthrough" = "getting-started/cats-walkthrough.md" },
  ] },
  { "Guides" = [
    { "Citation comments" = "guides/citations.md" },
    { "Citation styles" = "guides/styles.md" },
    { "Monitoring" = "guides/monitoring.md" },
    { "Local storage" = "guides/storage.md" },
    { "Cleanup" = "guides/cleanup.md" },
    { "Export references" = "guides/exports.md" },
  ] },
  { "Reference" = [
    { "CLI commands" = "reference/cli.md" },
    { "Saved plans" = "reference/advanced.md" },
    { "Verification and limits" = "reference/integrity.md" },
    { "Troubleshooting" = "reference/troubleshooting.md" },
  ] },
  { "Development" = "development.md" },
  { "Privacy" = "privacy.md" },
]

[project.theme]
features = ["navigation.tabs", "navigation.sections", "navigation.top", "content.code.copy"]
