[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citegoblin"
version = "0.4.0b3"
description = "Inspectable, revision-guarded citation management for Google Docs"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
google = ["google-auth>=2.0", "google-auth-oauthlib>=1.2", "keyring>=25", "requests>=2.31"]

docs = ["zensical==0.1.3"]

test = ["bibtexparser>=1.4,<2", "rispy>=0.9,<1"]

[project.scripts]
citegoblin = "citegoblin.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
citegoblin = ["formatter/*.cjs", "formatter/*.csl", "formatter/*.xml", "formatter/package*.json", "data/*.json"]
